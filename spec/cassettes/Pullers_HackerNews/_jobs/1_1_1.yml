      string: '{"by":"nedwin","id":27858363,"score":1,"text":"Great Question makes
        it easy to include customer research as a part of every product release -
        whether it&#x27;s customer interviews, prototype tests or surveys.<p>Companies
        from Adidas Runtastic to O&#x27;Reilly Media and Linktree use the product
        to put their customers at the center of their product decisions.<p>Our mission
        is to democratize research - make it easy for anyone at your company to understand
        what research has been done already, what is currently happening, and ask
        new questions to make sure you&#x27;re building something people want.<p>We&#x27;re
        3rd time entrepreneurs, having worked together for 10 years now with 2 exits
        under our belts. We&#x27;re backed by Y Combinator, Funders Club &amp; top
        angel investors.<p>We&#x27;re now looking to hire a Head of Product Marketing
        to help us refine our positioning, build our go to market strategy, and help
        us create a new category of software.<p>More on the company and the role can
