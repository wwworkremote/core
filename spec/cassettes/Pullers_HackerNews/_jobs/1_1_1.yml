    body:
      encoding: UTF-8
      string: '{"by":"vegter","id":27991593,"score":1,"text":"Bloom (www.joinbloom.community)
        is a consent-forward social and dating app that helps people meet around events.
        Bloom exists to help people build meaningful relationships and strengthen
        community. Our vision is a world in which all people feel safety and belonging.<p>Bloom
        is hiring a full-stack software engineer. Experience in React is required.
        We&#x27;re looking for someone who loves figuring out hard and ambiguous problems
        and is excited about joining a wild startup adventure. This is an opportunity
        to join an early-stage YCombinator-backed startup and shape the future of
        the product and the company.<p>Candidates can live anywhere; our team works
        primarily on Pacific Time. This is a remote contract position with potential
        conversion to full-time. Candidates must be available to start immediately.<p>Please
        reach out to careers@joinbloom.community.<p>About Bloom<p>Bloom&#x27;s company
        culture is best described as “chill, with focus.” We look at the trend line
        over the data points. We believe in life-work balance and we also commit to
        ambitious goals. We offer feedback generously, self-examine often, and aim
        to improve ourselves and our processes to achieve as much as we can. We believe
        in the possibility of change in the world and in ourselves.<p>The Bloom team
        is led by Lauren Vegter, who previously led User Acquisition at Instagram
        from 700M to past a billion users. You’ll be working alongside a world class
        team with experience from Facebook, Google, Oculus, Nest, multiple YCombinator-backed
        startups, and event production at the bleeding edge of the Bay Area underground
        arts scenes.<p>Learn more about our company culture and meet our Oakland-based
        team (<a href=\"https:&#x2F;&#x2F;www.joinbloom.community&#x2F;team\" rel=\"nofollow\">https:&#x2F;&#x2F;www.joinbloom.community&#x2F;team</a>).","time":1627520446,"title":"Bloom
        is hiring a Software Engineer to build the future of human connection","type":"job"}'
    http_version: '1.1'
