        (YC S22) Is Hiring a Front End Engineer"}},"_tags":["job","author_shardullavekar","front_page"],"author":"shardullavekar","created_at":"2025-12-30T01:00:03Z","created_at_i":1767056403,"job_text":"Location:
        Bangalore, India (Koramangala) \nCompensation: Competitive Salary + Significant
        Equity (YC Standard) \nFounders: Shardul Lavekar (ex-Airtel AI, ex-Ola) &amp;
        Parth Mudgal (ex-Flipkart, ex-Ola)<p>At 100x.bot, we are building the interface
        for this future. We are not just another &quot;AI Wrapper.&quot; We are a
        deep-tech company backed by Y Combinator, Accel, and Inventus, solving the
        hardest problem in automation: making browser agents reliable, fast, and accessible
        to everyone.<p>Most AI agents today are slow, expensive, and hallucinate frequently
        because they &quot;think too hard&quot; about every click. We take a different
        approach: &quot;Record once, Automate forever.&quot; We combine the deterministic
        speed of record-and-replay technology with the semantic intelligence of LLMs
        to create agents that utilize self-healing DOM maps to navigate the chaotic
        web with human-like resilience.<p>The Opportunity: More Than Just UI\nWe are
        looking for a Frontend Craftsperson to join our core engineering team in Bangalore.<p>This
        is not a role for someone who just wants to center divs or convert Figma files
        into React components. We are looking for an engineer who can architect the
        client-side experience for autonomous agents. You will be building the &quot;cockpit&quot;
        from which users control their digital workforce.<p>What You Will Architect\nThe
        Agent Visualization Engine: You will build complex, interactive graph-based
        interfaces that visualize agent workflows. Users need to see the logic flow\u2014loops,
        conditionals, and &quot;self-healing&quot; events\u2014in real-time.<p>Dynamic
        MCP Interfaces: You will build systems that dynamically generate UIs based
        on Model Context Protocol schemas. If an MCP server exposes a new tool, your
        UI should instantly adapt to support it, without a code deploy.<p>High-Performance
        Streaming UI: Our agents generate massive logs (DOM snapshots, network events,
        execution traces). You will use virtualization (e.g., react-window) and atomic
        state management (Zustand&#x2F;Jotai) to render these streams at 60fps, ensuring
        the UI never lags behind the bot.<p>The &quot;Recorder&quot; Experience: You
        will refine our Chrome Extension overlay, ensuring it injects cleanly into
        any third-party website (using Shadow DOM encapsulation) to capture user intent
        without breaking the host page.<p>The Tech Stack\nWe run a modern, type-safe
        stack designed for velocity and reliability.<p>Frontend: React, TypeScript,
        Next.js<p>Styling: Tailwind CSS (with Shadow DOM handling)<p>State: Zustand
        &#x2F; TanStack Query (for high-frequency updates)<p>Protocol: Model Context
        Protocol (MCP), WebSockets, Chrome Extension APIs<p>Who You Are\nA React Expert
        (2+ Years): You understand the React reconciliation algorithm inside out.
        You know why useEffect is dangerous for high-frequency data and how to use
        useRef or useSyncExternalStore to optimize performance.<p>TypeScript Native:
        You don&#x27;t just use any. You write robust, generic types that mirror complex
        backend schemas. You are comfortable sharing types between the extension background
        script and the UI.<p>A &quot;Craftsperson&quot;: You care about micro-interactions.
        You understand that trust is built through UI feedback\u2014a loading spinner,
        a hover state, a smooth transition. You take pride in building developer tools
