# wwworkremote.localhost / wwwr.localhost / lan.wwworkremote.com — WWWorkRemote dev cockpit (Puma, port 31000).
# Source-owned by github.com/wwworkremote/core; deploy to /opt/homebrew/etc/nginx/servers/wwworkremote.conf.
# All names are equal aliases for the same backend (no canonical/redirect split) --
# see docs/development.md for the local app.
#
# The .localhost names remain loopback-only development aliases. lan.wwworkremote.com
# is a real public DNS A record pointing at this Mac's LAN address (10.36.1.149) --
# resolves normally everywhere (including phones, no mDNS/.arpa resolver quirks),
# but only connects from the trusted LAN since the address itself isn't routable
# from outside it. Replaced the earlier .home.arpa + local AdGuard rewrite approach,
# which macOS/iOS's resolver silently refuses to look up via getaddrinfo.

upstream wwworkremote_backend {
    server 127.0.0.1:31000;
    keepalive 4;
}

server {
    listen 80;
    server_name wwworkremote.localhost wwwr.localhost lan.wwworkremote.com;
    # 308, not 301: a 301 makes clients drop the request body (and most
    # downgrade POST to GET) on the way to https, so an API POST sent to
    # http:// here arrives with empty params and silently no-ops -- the
    # server answers 200 with success:false and nothing is written. 308 is
    # the same permanent redirect with the method and body preserved.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wwworkremote.localhost wwwr.localhost lan.wwworkremote.com;
    include ssl_params.conf;

    proxy_http_version    1.1;
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    client_max_body_size  25m;

    location / {
        proxy_pass         http://wwworkremote_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
