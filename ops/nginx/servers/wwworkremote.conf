# wwworkremote.localhost / wwwr.localhost — WWWorkRemote dev cockpit (Falcon/Puma, port 31000).
# Source-owned by github.com/wwworkremote/core; deploy to /opt/homebrew/etc/nginx/servers/wwworkremote.conf.
# Both names are equal aliases for the same backend (no canonical/redirect split) --
# see docs/development.md for the local app.
#
# Hostnames use the .localhost TLD (decision-011): IANA-reserved (RFC 6761),
# every OS/browser resolver hard-wires it to loopback, no /etc/hosts entry
# needed, no mDNS/.local name-collision exposure.

upstream wwworkremote_backend {
    server 127.0.0.1:31000;
    keepalive 4;
}

server {
    listen 80;
    server_name wwworkremote.localhost wwwr.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wwworkremote.localhost wwwr.localhost;
    include ssl_params.conf;

    proxy_http_version    1.1;
    proxy_read_timeout    120s;
    proxy_connect_timeout 5s;
    client_max_body_size  25m;

    location / {
        proxy_pass         http://wwworkremote_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
