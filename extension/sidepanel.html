<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWWorkRemote — Review Panel</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #282a36;
      --bg-mid:    #44475a;
      --bg-dark:   #1e2029;
      --comment:   #6272a4;
      --fg:        #f8f8f2;
      --purple:    #bd93f9;
      --pink:      #ff79c6;
      --green:     #50fa7b;
      --yellow:    #f1fa8c;
      --orange:    #ffb86c;
      --red:       #ff5555;
      --cyan:      #8be9fd;
      --radius:    6px;
      --font:      'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.5;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #header {
      background: var(--bg-mid);
      border-bottom: 1px solid var(--comment);
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }

    #header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    #header-title {
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 10px;
      color: var(--pink);
    }

    #header-meta {
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: var(--comment);
    }

    #header-meta span b { color: var(--fg); font-weight: normal; }

    #confidence-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }

    #field-summary {
      font-size: 10px;
      color: var(--comment);
    }

    #field-summary b { color: var(--green); }

    /* ── Scrollable form body ─────────────────────────────────────────────── */
    #form-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px 8px;
    }

    /* ── Section headers ──────────────────────────────────────────────────── */
    .section-header {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--comment);
      border-bottom: 1px solid var(--bg-mid);
      padding-bottom: 4px;
      margin: 14px 0 8px;
    }

    .section-header:first-child { margin-top: 0; }

    /* ── Fields ───────────────────────────────────────────────────────────── */
    .field { margin-bottom: 10px; }

    .field label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--comment);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Source indicator dot */
    .src {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .src.found   { background: var(--green); }
    .src.missing { background: var(--comment); border: 1px solid var(--comment); background: transparent; }

    /* Required field marker */
    .req { color: var(--red); margin-left: 1px; }

    input[type="text"],
    input[type="url"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      background: var(--bg-dark);
      color: var(--fg);
      border: 1px solid var(--bg-mid);
      border-radius: var(--radius);
      padding: 6px 9px;
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--purple);
    }

    /* Filled fields get a subtle left accent */
    .field.filled input,
    .field.filled select,
    .field.filled textarea {
      border-left: 2px solid var(--green);
    }

    /* Empty required fields get amber accent */
    .field.empty-required input,
    .field.empty-required select,
    .field.empty-required textarea {
      border-left: 2px solid var(--yellow);
    }

    /* Empty optional fields — subtle */
    .field.empty input,
    .field.empty select,
    .field.empty textarea {
      border-left: 2px solid transparent;
      color: var(--comment);
    }

    textarea { resize: vertical; }

    select option { background: var(--bg-dark); color: var(--fg); }

    /* ── Salary row ───────────────────────────────────────────────────────── */
    .salary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .salary-meta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    /* ── Remote row ───────────────────────────────────────────────────────── */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      background: var(--bg-dark);
      border: 1px solid var(--bg-mid);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: auto;
      accent-color: var(--green);
      cursor: pointer;
    }

    .checkbox-row label {
      margin: 0;
      font-size: 12px;
      color: var(--fg);
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    /* ── Description word count ───────────────────────────────────────────── */
    #desc-meta {
      font-size: 10px;
      color: var(--comment);
      margin-top: 3px;
      text-align: right;
    }

    /* ── Apply URL link ───────────────────────────────────────────────────── */
    #apply-link {
      display: none;
      font-size: 10px;
      color: var(--cyan);
      margin-top: 3px;
      text-decoration: none;
      word-break: break-all;
    }

    #apply-link:hover { text-decoration: underline; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    #footer {
      background: var(--bg-mid);
      border-top: 1px solid var(--comment);
      padding: 10px 14px;
      flex-shrink: 0;
    }

    #submit-btn {
      width: 100%;
      padding: 10px;
      background: var(--purple);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #submit-btn:hover { background: #caa8fc; }
    #submit-btn:active { background: #a070e8; }
    #submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #status-line {
      text-align: center;
      font-size: 10px;
      color: var(--comment);
      margin-top: 6px;
      min-height: 14px;
    }

    /* ── Empty state ──────────────────────────────────────────────────────── */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--comment);
      text-align: center;
      padding: 20px;
    }

    #empty-state .icon { font-size: 32px; }
    #empty-state p { font-size: 11px; line-height: 1.7; }
    #empty-state code {
      color: var(--yellow);
      background: var(--bg-dark);
      padding: 1px 5px;
      border-radius: 3px;
    }

    /* ── Scrollbar ────────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--bg-mid); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--comment); }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Empty / loading state ── -->
  <div id="empty-state">
    <div class="icon">🔍</div>
    <p>
      Open a job posting with<br>
      <code>?wwr_id=NNN</code> appended to the URL,<br>
      or click <strong>Source &amp; Enrich</strong> from a<br>
      WWWorkRemote job page.
    </p>
  </div>

  <!-- ── Header ── -->
  <div id="header" style="display:none">
    <div id="header-top">
      <span id="header-title">Synthesis Panel</span>
      <span id="confidence-badge">—</span>
    </div>
    <div id="header-meta">
      <span>ID: <b id="hdr-id">—</b></span>
      <span>Board: <b id="hdr-board">—</b></span>
    </div>
    <div id="field-summary" style="margin-top:4px;">
      <b id="hdr-filled">0</b> fields extracted &nbsp;·&nbsp;
      <span id="hdr-missing" style="color:var(--yellow);">0 missing</span>
    </div>
  </div>

  <!-- ── Form body ── -->
  <div id="form-body" style="display:none">

    <!-- Core -->
    <div class="section-header">Core</div>

    <div class="field" id="fld-title">
      <label><span class="src missing" id="src-title"></span>Title<span class="req">*</span></label>
      <input type="text" id="f-title" placeholder="Job title…" maxlength="255">
    </div>

    <div class="field" id="fld-company">
      <label><span class="src missing" id="src-company"></span>Company</label>
      <input type="text" id="f-company" placeholder="Company name…" maxlength="255">
    </div>

    <div class="field" id="fld-location">
      <label><span class="src missing" id="src-location"></span>Location</label>
      <input type="text" id="f-location" placeholder="City, Region or Remote…" maxlength="255">
    </div>

    <div class="field" id="fld-remote">
      <label><span class="src missing" id="src-remote"></span>Remote</label>
      <div class="checkbox-row" onclick="document.getElementById('f-remote').click()">
        <input type="checkbox" id="f-remote">
        <label for="f-remote" id="remote-label">Remote position</label>
      </div>
    </div>

    <!-- Job details -->
    <div class="section-header">Job Details</div>

    <div class="field" id="fld-employment-type">
      <label><span class="src missing" id="src-employment-type"></span>Employment type</label>
      <select id="f-employment-type">
        <option value="">— select or leave blank —</option>
        <option value="FULL_TIME">Full-time</option>
        <option value="PART_TIME">Part-time</option>
        <option value="CONTRACTOR">Contract</option>
        <option value="TEMPORARY">Temporary</option>
        <option value="INTERN">Internship</option>
        <option value="VOLUNTEER">Volunteer</option>
        <option value="OTHER">Other</option>
      </select>
    </div>

    <div class="field" id="fld-experience">
      <label><span class="src missing" id="src-experience"></span>Experience</label>
      <input type="text" id="f-experience" placeholder="e.g. 3+ years, senior, entry-level…" maxlength="255">
    </div>

    <div class="field" id="fld-apply-url">
      <label><span class="src missing" id="src-apply-url"></span>Apply URL</label>
      <input type="url" id="f-apply-url" placeholder="https://…">
      <a id="apply-link" target="_blank" rel="noopener">↗ open application</a>
    </div>

    <!-- Compensation -->
    <div class="section-header">Compensation</div>

    <div class="field" id="fld-salary-range">
      <label><span class="src missing" id="src-salary"></span>Salary range</label>
      <div class="salary-row">
        <input type="number" id="f-salary-min" placeholder="Min (e.g. 120000)" min="0">
        <input type="number" id="f-salary-max" placeholder="Max (e.g. 160000)" min="0">
      </div>
      <div class="salary-meta-row">
        <select id="f-salary-currency">
          <option value="">Currency</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
        </select>
        <select id="f-salary-unit">
          <option value="">Per…</option>
          <option value="YEAR">Year</option>
          <option value="MONTH">Month</option>
          <option value="HOUR">Hour</option>
        </select>
      </div>
      <!-- Fallback: raw salary string from CSS extraction -->
      <input type="text" id="f-salary-raw" placeholder="Or paste salary text (e.g. $120k–$160k/yr)"
             style="margin-top:8px;" maxlength="255">
    </div>

    <!-- Description -->
    <div class="section-header">Description</div>

    <div class="field" id="fld-description">
      <label><span class="src missing" id="src-description"></span>Description (plain text)</label>
      <textarea id="f-description" rows="12"
        placeholder="Paste or type the job description…&#10;&#10;Tip: expand 'Show more' on the job page before extracting for the full text."></textarea>
      <div id="desc-meta">0 words</div>
    </div>

    <!-- Timing -->
    <div class="section-header">Timing</div>

    <div class="field" id="fld-posted-at">
      <label><span class="src missing" id="src-posted-at"></span>Posted</label>
      <input type="date" id="f-posted-at">
    </div>

    <div class="field" id="fld-valid-through">
      <label><span class="src missing" id="src-valid-through"></span>Expires</label>
      <input type="date" id="f-valid-through">
    </div>

    <!-- Skills -->
    <div class="section-header">Skills &amp; Tags</div>

    <div class="field" id="fld-skills">
      <label><span class="src missing" id="src-skills"></span>Skills / Tags</label>
      <input type="text" id="f-skills"
             placeholder="ruby, rails, remote, senior (comma-separated)…" maxlength="500">
    </div>

  </div><!-- /form-body -->

  <!-- ── Footer ── -->
  <div id="footer" style="display:none">
    <button id="submit-btn" disabled>Submit to WWWorkRemote</button>
    <div id="status-line">Waiting for job data…</div>
  </div>

</div><!-- /app -->
<script src="sidepanel.js"></script>
</body>
</html>
