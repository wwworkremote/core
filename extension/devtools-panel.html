<!doctype html><meta charset="utf-8"><title>WWWorkRemote telemetry</title>
<style>body{background:#22212c;color:#f8f8f2;font:12px monospace;padding:12px}h1{font-size:14px;color:#ff80bf}pre{white-space:pre-wrap;border-top:1px solid #454158;padding:8px 0}</style>
<h1>WWWorkRemote CDP prototype</h1>
<p>Read-only accessibility and DOM snapshot probe for the inspected tab.</p>
<button id="capture">Capture inspected tab</button>
<div id="cdp-status">Ready</div><pre id="cdp-output"></pre>
<h1>WWWorkRemote error telemetry</h1>
<div id="telemetry-status">Listening…</div><pre id="telemetry-events"></pre>
<script>
document.querySelector('#capture').addEventListener('click', () => {
  const button = document.querySelector('#capture');
  const status = document.querySelector('#cdp-status');
  const output = document.querySelector('#cdp-output');
  button.disabled = true;
  status.textContent = 'Capturing without page mutation…';
  chrome.runtime.sendMessage({ type: 'CDP_CAPTURE_SNAPSHOT', tabId: chrome.devtools.inspectedWindow.tabId }, response => {
    button.disabled = false;
    if (chrome.runtime.lastError || !response?.ok) {
      status.textContent = 'Capture failed';
      output.textContent = chrome.runtime.lastError?.message || response?.error || 'Unknown capture error';
      return;
    }
    status.textContent = 'Captured and detached';
    output.textContent = JSON.stringify(response.snapshot, null, 2);
  });
});

const key = 'wwr_panel_state';
function render(state) {
  const entries = (state?.diagnostics || []).filter(e => e.level === 'error' || e.detail?.event);
  document.querySelector('#telemetry-status').textContent = `${entries.length} local events · build ${state?.diagnostics?.at(-1)?.detail?.build_version || 'unknown'}`;
  document.querySelector('#telemetry-events').textContent = entries.map(e => `[${new Date(e.ts).toISOString()}] ${e.text}\n${JSON.stringify(e.detail || {})}`).join('\n\n');
}
chrome.storage.session.get(key, data => render(data[key]));
chrome.storage.onChanged.addListener((changes, area) => { if (area === 'session' && changes[key]) render(changes[key].newValue); });
</script>
