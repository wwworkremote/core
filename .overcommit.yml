---
# Overcommit configuration
# See: https://github.com/sds/overcommit

# Verify that overcommit is installed
verify_signatures: false

PreCommit:
  ALL:
    on_warn: fail  # Failure is required
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'
      - 'spec/**/*'

  # Basic Info
  AuthorName:
    enabled: true

  AuthorEmail:
    enabled: true

  # Git stuff
  MergeConflicts:
    enabled: true

  BrokenSymlinks:
    enabled: true

  # Linting/Formatting
  HardTabs:
    enabled: true
    exclude:
      - '**/Makefile'
      - 'node_modules/**/*'
      - 'vendor/**/*'

  TrailingWhitespace:
    enabled: true
    exclude:
      - '**/db/schema.rb'
      - 'node_modules/**/*'
      - 'vendor/**/*'
      - 'spec/**/*'

  EndOfLine:
    enabled: true

  FixMe:
    enabled: true
    keywords: ['FIXME', 'TODO', 'HACK']
    exclude:
      - '.overcommit.yml'
      - 'node_modules/**/*'
      - 'vendor/**/*'

  YamlLint:
    enabled: true
    command: ['yamllint', '.']
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'
      - 'spec/cassettes/**/*'
      - 'config/locales/**/*'
      - '.rubocop_todo.yml'

  JsonSyntax:
    enabled: true
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

  # Ruby specific
  RuboCop:
    enabled: true
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

  Brakeman:
    enabled: true

  BundleAudit:
    enabled: true

  RailsBestPractices:
    enabled: false
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

  Reek:
    enabled: false
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

  Fasterer:
    enabled: false
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

  RSpec:
    enabled: true
    # Explicit dirs, not a bare `rspec` -- packages/*/spec (the ingestion
    # engine's specs) sits outside RSpec's default_path ("spec"), so a bare
    # invocation silently never discovers it. Listed explicitly (not a glob)
    # since command: execs directly, without shell glob expansion.
    command: ['bundle', 'exec', 'rspec', 'spec', 'packages/ingestion/spec']
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test

  # Shell scripts
  ShellCheck:
    enabled: true
    include:
      - 'bin-host/**/*'
      - '**/*.sh'
    exclude:
      - 'bin/**/*'
      - 'node_modules/**/*'
      - 'vendor/**/*'

  # Docker
  Hadolint:
    enabled: true
    include:
      - 'Dockerfile*'
    exclude:
      - 'node_modules/**/*'
      - 'vendor/**/*'

CommitMsg:
  ALL:
    on_warn: fail

  CapitalizedSubject:
    enabled: true
    # This repo's entire history uses lowercase Conventional Commits prefixes
    # (fix:/chore:/feat:), which this hook otherwise rejects -- don't let
    # ALL's on_warn: fail escalate that mismatch into a hard failure.
    on_warn: warn

  SingleLineSubject:
    enabled: true

  TextWidth:
    enabled: true
    max_subject_width: 72
    max_body_width: 72

  TrailingPeriod:
    enabled: true

PostCheckout:
  BundleInstall:
    enabled: true

PostMerge:
  BundleInstall:
    enabled: true

PrePush:
  ForbiddenBranches:
    enabled: true
    branch_patterns: ['main', 'master', 'develop']

  Brakeman:
    enabled: true

  RuboCop:
    enabled: true
