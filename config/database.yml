---
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost

development:
  <<: *default
  database: wwworkremote_development

test:
  <<: *default
  database: wwworkremote_test

production:
  <<: *default
  database: wwworkremote_production
  username: deploy
  password: <%= ENV["WWWORKREMOTE_DATABASE_PASSWORD"] %>
