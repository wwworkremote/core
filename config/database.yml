---
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>

development:
  <<: *default
  # database: outlier_jobs_development
  url: <%= ENV.fetch('OUTLIER_JOBS_DATABASE_URL') %>

test:
  <<: *default
  database: outlier_jobs_test

production:
  <<: *default
  url: <%= ENV.fetch('OUTLIER_JOBS_DATABASE_URL') %>

# For details on connection pooling, see Rails configuration guide
# https://guides.rubyonrails.org/configuring.html#database-pooling
