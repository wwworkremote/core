default: &default
  adapter: postgresql
  encoding: unicode
  reconnect: true
  # Increased pool for Async/Fibers concurrency and Solid Queue background processing
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 50 } %>
  # Longer timeout to prevent ConnectionTimeoutError during heavy LLM orchestration
  checkout_timeout: <%= ENV.fetch("DATABASE_CHECKOUT_TIMEOUT") { 10 } %>

development:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgres://postgres:password@localhost:5432/wwworkremote_development" } %>
  replica:
    <<: *default
    url: <%= ENV.fetch("DATABASE_REPLICA_URL") { ENV.fetch("DATABASE_URL") { "postgres://postgres:password@localhost:5432/wwworkremote_development" } } %>
    replica: true

test:
  primary:
    <<: *default
    database: wwworkremote_test
  replica:
    <<: *default
    database: wwworkremote_test
    replica: true

production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgres://deploy@localhost/wwworkremote_production" } %>
  replica:
    <<: *default
    url: <%= ENV.fetch("DATABASE_REPLICA_URL") { ENV.fetch("DATABASE_URL") { "postgres://deploy@localhost/wwworkremote_production" } } %>
    replica: true
