default: &default
  adapter: postgresql
  encoding: unicode
  reconnect: true
  # Disable GSSAPI encryption to prevent macOS fork segmentation faults
  gssencmode: "disable"
  # High-density pool for high concurrency (Falcon/Puma threads + Solid Queue)
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 100 } %>
  # Long checkout timeout to prevent contention during heavy LLM orchestration
  checkout_timeout: <%= ENV.fetch("DATABASE_CHECKOUT_TIMEOUT") { 20 } %>

development:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgres://postgres:password@localhost:5432/wwworkremote_development" } %>
  replica:
    <<: *default
    url: <%= ENV.fetch("DATABASE_REPLICA_URL") { ENV.fetch("DATABASE_URL") { "postgres://postgres:password@localhost:5432/wwworkremote_development" } } %>
    replica: true

test:
  primary:
    <<: *default
    database: wwworkremote_test
  replica:
    <<: *default
    database: wwworkremote_test
    replica: true

production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") { "postgres://deploy@localhost/wwworkremote_production" } %>
  replica:
    <<: *default
    url: <%= ENV.fetch("DATABASE_REPLICA_URL") { ENV.fetch("DATABASE_URL") { "postgres://deploy@localhost/wwworkremote_production" } } %>
    replica: true
