upstream puma_wwworkremote_web {
  server unix:///home/deploy/projects/wwworkremote/core/shared/sockets/puma.sock;
}

server {
  listen 8080;
  server_name node01 node02 node03 node04 node05;

  root /home/deploy/projects/wwworkremote/core/current/public;

  access_log /home/deploy/projects/wwworkremote/core/shared/log/nginx.access.log;
  error_log /home/deploy/projects/wwworkremote/core/shared/log/nginx.error.log info;

  location ~ ^/assets/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  try_files $uri/index.html $uri @puma_wwworkremote_web;

  location @puma_wwworkremote_web {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;

    proxy_pass http://puma_wwworkremote_web;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 10M;
  keepalive_timeout 10;
}

