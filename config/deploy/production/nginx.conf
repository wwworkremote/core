#D I E T - P I
# /etc/nginx/sites-available/default
# /etc/nginx/sites-available

upstream puma {
  server unix:///home/deploy/projects/wwworkremote/core/shared/sockets/puma.sock;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name "$hostname.zalewhol.internal" "$hostname";

  root /home/deploy/projects/wwworkremote/core/current/public;

  access_log /home/deploy/projects/wwworkremote/core/shared/log/nginx.access.log;
  error_log /home/deploy/projects/wwworkremote/core/shared/log/nginx.error.log info;

  location ~ ^/assets/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  try_files $uri/index.html $uri @puma;

  location @puma {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_redirect off;

    proxy_pass http://puma;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 10M;
  keepalive_timeout 10;
}
