# Unified Data Acquisition (API, Scrapers, ATS)
fetch_all_jobs:
  cron: "0 */6 * * *"
  class: "DataAcquisition::RunAllWorker"
  queue: default

# Redundant if RunAllWorker succeeds, but kept for safety or manual raw document syncs
sync_to_dashboard:
  cron: "45 * * * *"
  class: "SyncJob"
  queue: default
