---
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>

development:
  <<: *default
  url: <%= Rails.application.credentials.database[:url] %>

test:
  <<: *default
  url: <%= Rails.application.credentials.database[:url] %>

production:
  <<: *default
  url: <%= Rails.application.credentials.database[:url] %>
