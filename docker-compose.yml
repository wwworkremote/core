services:
  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wwworkremote_development
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wwworkremote_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
    command: ./bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/wwworkremote_development
      REDIS_URL: redis://redis:6379/1
      ADZUNA_APPLICATION_ID: ${ADZUNA_APPLICATION_ID}
      ADZUNA_APPLICATION_KEY: ${ADZUNA_APPLICATION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: wwworkremote-web
      OLLAMA_API_BASE: http://host.docker.internal:8080/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
    command: bundle exec sidekiq
    volumes:
      - .:/rails
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/wwworkremote_development
      REDIS_URL: redis://redis:6379/1
      ADZUNA_APPLICATION_ID: ${ADZUNA_APPLICATION_ID}
      ADZUNA_APPLICATION_KEY: ${ADZUNA_APPLICATION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: wwworkremote-worker
      OLLAMA_API_BASE: http://host.docker.internal:8080/v1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP

volumes:
  db_data:
  redis_data:
