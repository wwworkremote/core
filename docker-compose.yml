services:
  web:
    build:
      context: .
    command: ./bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
    ports:
      - "3010:3000"
    environment:
      # Point to host machine PostgreSQL
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@host.docker.internal:5432/wwworkremote_development
      # Point to host machine Redis
      REDIS_URL: redis://host.docker.internal:6379/1
      ADZUNA_APPLICATION_ID: ${ADZUNA_APPLICATION_ID}
      ADZUNA_APPLICATION_KEY: ${ADZUNA_APPLICATION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: wwworkremote-web
      OLLAMA_API_BASE: http://host.docker.internal:8080/v1
    depends_on:
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
    command: bundle exec sidekiq
    volumes:
      - .:/rails
    environment:
      # Point to host machine PostgreSQL
      DATABASE_URL: postgres://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@host.docker.internal:5432/wwworkremote_development
      # Point to host machine Redis
      REDIS_URL: redis://host.docker.internal:6379/1
      ADZUNA_APPLICATION_ID: ${ADZUNA_APPLICATION_ID}
      ADZUNA_APPLICATION_KEY: ${ADZUNA_APPLICATION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: wwworkremote-worker
      OLLAMA_API_BASE: http://host.docker.internal:8080/v1
    depends_on:
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP
