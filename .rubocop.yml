---
require:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rubycw
  - rubocop-thread_safety

AllCops:
  CacheRootDirectory: 'tmp/'
  DefaultFormatter: fuubar
  DisabledByDefault: false
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  MaxFilesInCache: 65536
  NewCops: enable
  TargetRubyVersion: 3.0
  UseCache: true
  Include:
    - 'Capfile'
    - 'Gemfile'
    - 'Guardfile'
    - 'Rakefile'
    - 'app/**/*.rb'
    - 'bin/**/*.rb'
    - 'config.ru'
    - 'config/**/*.rb'
    - 'db/**/*.rb'
    - 'exe/**/*'
    - 'lib/**/*.rb'
  Exclude:
    - '**/node_modules/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'exe/dice'

Lint/UnusedBlockArgument:
  Exclude:
    - 'config/initializers/sentry.rb'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Exclude:
    - 'app/models/moment.rb'
    - 'app/services/pullers/hackernews.rb'
    - 'app/services/pullers/indeed.rb'
    - 'app/services/pullers/monster.rb'
    - 'app/services/pullers/nexxt.rb'
    - 'app/services/pullers/remoteok.rb'
    - 'app/services/pullers/remotepython.rb'
    - 'app/services/pullers/stackoverflow.rb'
    - 'app/services/pullers/weworkremotely.rb'
    - 'bin/bundle'
    - 'db/migrate/20210712004243_create_moments.rb'

Metrics/AbcSize:
  Exclude:
    - 'app/services/pullers/monster.rb'

Metrics/BlockLength:
  Exclude:
    - 'exe/messages'
    - 'Guardfile'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'bin/bundle'

Metrics/PerceivedComplexity:
  Exclude:
    - 'bin/bundle'

Naming/InclusiveLanguage:
  Enabled: false

Rails/Date:
  Exclude:
    - 'config/schedule.rb'

Rails/CreateTableWithTimestamps:
  Exclude:
    - 'db/migrate/20210712020439_create_pghero_query_stats.rb'
    - 'db/migrate/20210712021013_create_pghero_space_stats.rb'
