---
require:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rubycw
  - rubocop-thread_safety

AllCops:
  CacheRootDirectory: 'tmp/'
  DefaultFormatter: fuubar
  DisabledByDefault: false
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  MaxFilesInCache: 65536
  NewCops: enable
  TargetRubyVersion: 3.0
  UseCache: true

  Exclude:
    - '**/node_modules/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Exclude:
    - 'bin/bundle'
    - 'app/services/hackernews.rb'
    - 'app/services/monster.rb'
    - 'app/services/remoteok.rb'
    - 'app/services/stackoverflow.rb'
    - 'app/services/weworkremotely.rb'
    - 'app/services/indeed.rb'

Metrics/AbcSize:
  Exclude:
    - 'app/services/monster.rb'

Metrics/BlockLength:
  Exclude:
    - 'Guardfile'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'bin/bundle'

Metrics/PerceivedComplexity:
  Exclude:
    - 'bin/bundle'

Naming/InclusiveLanguage:
  Enabled: false
