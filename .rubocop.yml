---
require:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rubycw
  - rubocop-thread_safety

AllCops:
  CacheRootDirectory: 'tmp/'
  DefaultFormatter: fuubar
  DisabledByDefault: false
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  MaxFilesInCache: 65536
  NewCops: enable
  TargetRubyVersion: 3.0
  UseCache: true
  Include:
    - 'lib/tasks/**.rake'
    - 'Capfile'
    - 'Gemfile'
    - 'Guardfile'
    - 'Rakefile'
    - 'app/**/*.rb'
    - 'bin/**/*.rb'
    - 'config.ru'
    - 'config/**/*.rb'
    - 'db/**/*.rb'
    - 'exe/**/*'
    - 'lib/**/*.rb'
    - 'spec/**/*.rb'
  Exclude:
    - '**/.DS_Store'
    - '**/node_modules/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'exe/all'
    - 'exe/backup'
    - 'exe/dice'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false
  Exclude:
    - 'app/lib/pullers/hackernews.rb'
    - 'app/lib/pullers/indeed.rb'
    - 'app/lib/pullers/monster.rb'
    - 'app/lib/pullers/nexxt.rb'
    - 'app/lib/pullers/remoteok.rb'
    - 'app/lib/pullers/remotepython.rb'
    - 'app/lib/pullers/stackoverflow.rb'
    - 'app/lib/pullers/weworkremotely.rb'
    - 'bin/bundle'
    - 'db/migrate/20210815003805_create_job_postings.rb'

Metrics/AbcSize:
  Enabled: false
  Exclude:
    - 'app/services/pullers/monster.rb'
    - 'db/migrate/20210815003805_create_job_postings.rb'

Metrics/BlockLength:
  Exclude:
    - 'Guardfile'
    - 'config/environments/development.rb'
    - 'config/environments/test.rb'
    - 'config/environments/production.rb'
    - 'exe/job_postings'
    - 'lib/tasks/auto_annotate_models.rake'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'bin/bundle'

Metrics/PerceivedComplexity:
  Exclude:
    - 'bin/bundle'

Naming/InclusiveLanguage:
  Enabled: false

Rails/Date:
  Exclude:
    - 'config/schedule.rb'

Rails/Output:
  Enabled: false

Lint/SuppressedException:
  Enabled: false

Lint/DuplicateBranch:
  Exclude:
    - 'exe/job_postings'

Rails/CreateTableWithTimestamps:
  Exclude:
    - 'db/migrate/20210712020439_create_pghero_query_stats.rb'
    - 'db/migrate/20210712021013_create_pghero_space_stats.rb'

Style/RescueModifier:
  Enabled: false

Style/BlockDelimiters:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/RescueStandardError:
  Enabled: false
