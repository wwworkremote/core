name: CI

# Solo project, and GitHub Actions billing is disabled on this account
# (Settings -> Billing & plans) -- automatic runs just fail in 4s with a
# billing error and cost nothing but noise. So CI is MANUAL ONLY: it runs
# only when someone hits "Run workflow" (workflow_dispatch).
#
# Everyday coverage is local:
#   overcommit pre-commit : RuboCop (-a) + working-tree-scoped RSpec + ESLint
#   overcommit pre-push   : Brakeman
#   bin/ci                : full suite via act (needs Docker)
# This workflow is the one thing those don't give cheaply: the *entire* test
# suite on a clean machine. Trigger it before a risky merge, or after billing
# is restored, or delete the file if CI is never coming back.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wwworkremote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      # Cheap gates first -- fail before paying for Node / DB / asset build.
      - name: RuboCop
        run: bundle exec rubocop

      - name: Brakeman
        run: bundle exec brakeman -q -n -w2

      - name: Bundler audit
        run: bundle exec bundle-audit check --update

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # create + schema:load (not db:prepare) -- the suite builds its own
      # data via factories and doesn't expect seeded rows.
      - name: Prepare database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      # app/assets/builds/* is gitignored -- any spec that renders a layout
      # needs the compiled stylesheet present or Propshaft 404s.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Boot check
        run: bundle exec rails runner 'puts :ok'

      - name: Test suite
        run: bundle exec rspec spec packages/ingestion/spec
