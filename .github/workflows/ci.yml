name: CI

# Solo project -- run the whole suite once, on main, after work lands.
# The fast feedback loop is already covered locally by overcommit:
#   pre-commit : RuboCop (-a) + working-tree-scoped RSpec + ESLint
#   pre-push   : Brakeman
# CI does the one thing local hooks don't: the *entire* test suite, plus a
# belt-and-braces RuboCop / Brakeman / bundler-audit in case something was
# pushed with --no-verify.
#
# To check a branch before merging, hit "Run workflow" (workflow_dispatch)
# or run `bin/ci` locally.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wwworkremote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: true

      # Cheap gates first -- fail before paying for Node / DB / asset build.
      - name: RuboCop
        run: bundle exec rubocop

      - name: Brakeman
        run: bundle exec brakeman -q -n -w2

      - name: Bundler audit
        run: bundle exec bundle-audit check --update

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # create + schema:load (not db:prepare) -- the suite builds its own
      # data via factories and doesn't expect seeded rows.
      - name: Prepare database
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      # app/assets/builds/* is gitignored -- any spec that renders a layout
      # needs the compiled stylesheet present or Propshaft 404s.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Boot check
        run: bundle exec rails runner 'puts :ok'

      - name: Test suite
        run: bundle exec rspec spec packages/ingestion/spec
