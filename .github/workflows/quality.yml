name: Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: wwworkremote_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.2'
          bundler-cache: true

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Database Setup
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test
        run: |
          bin/rails db:create
          bin/rails db:schema:load

      - name: Run Quality Suite
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test
        run: bundle exec rake quality

      - name: Run Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/wwworkremote_test
        run: bundle exec rspec
