# .reek.yml
# See: https://github.com/troessner/reek

directories:
  "db/migrate":
    IrresponsibleModule: { enabled: false }
    TooManyStatements: { max_statements: 50 }
    FeatureEnvy: { enabled: false }
    DuplicateMethodCall: { enabled: false }
    UncommunicativeVariableName: { enabled: false }

exclude_paths:
  - blorgh
  - spec
  - test
  - node_modules
  - vendor
  - db/migrate

detectors:
  IrresponsibleModule:
    enabled: false
  UtilityFunction:
    enabled: false
  FeatureEnvy:
    enabled: false
  InstanceVariableAssumption:
    enabled: false # Standard Rails controllers trigger this
  UncommunicativeVariableName:
    enabled: false # Too strict
  UncommunicativeModuleName:
    enabled: false # V0 is fine
  TooManyStatements:
    enabled: false # Legacy methods
  DuplicateMethodCall:
    enabled: false # Too noisy
  BooleanParameter:
    enabled: false # force: true is standard pattern
  NestedIterators:
    enabled: false
  ControlParameter:
    enabled: false
  DataClump:
    enabled: false
